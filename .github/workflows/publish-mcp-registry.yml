name: Publish to MCP Registry
# Run by hand from the Actions tab after a release is on npm. It publishes server.json as it is on main.
# Signs in with GitHub OIDC (the repo's own identity): no token is stored and no personal login is needed.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: publish-mcp-registry
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that this version is on npm
        run: |
          name=$(node -p "require('./server.json').packages[0].identifier")
          version=$(node -p "require('./server.json').packages[0].version")
          npm view "$name@$version" version
      # One release of the publisher, checked against its checksum, since this job can sign in to the registry as
      # this repository. To move to a newer one, change the version and take the linux_amd64 line from that release's
      # registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
          MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
