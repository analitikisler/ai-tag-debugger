name: Publish to npm
# Publishes when the version in package.json on main is not on npm yet.
# Uses npm trusted publishing (OIDC): no token is stored, and npm adds provenance.
# Only the publish job can get the publish credential; it runs no install scripts or tests.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/publish.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency: publish
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check whether this version is already on npm
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  publish:
    needs: [check, test]
    if: needs.check.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.6.2
      - run: npm publish --access public
  site:
    # Rebuilds analitikisler.com so its homepage shows the new version. Also runs when the
    # workflow is started by hand, to rebuild the site without a new release.
    needs: publish
    if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait until npm serves the new version, then start a Cloudflare build
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$SITE_DEPLOY_HOOK" ]; then
            echo "::warning::The SITE_DEPLOY_HOOK secret is not set, so analitikisler.com was not rebuilt."
            exit 0
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            latest=$(curl -fsS "https://registry.npmjs.org/$name/latest" | jq -r .version) || true
            [ "$latest" = "$version" ] && break
            echo "npm still serves $latest, waiting for $version..."
            sleep 10
          done
          curl -fsS -X POST "$SITE_DEPLOY_HOOK" > /dev/null
          echo "Started a Cloudflare build of analitikisler.com for $name@$latest."
