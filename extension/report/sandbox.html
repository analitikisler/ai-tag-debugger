<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  // Sandboxed (see manifest.json): this page has no extension APIs. It takes the finished report from the report tab
  // that embeds it, and from nowhere else, and replaces itself with it; the report's own CSP then applies.
  window.addEventListener("message", (e) => {
    if (e.source !== window.parent || !e.data || e.data.type !== "aitd-report" || typeof e.data.html !== "string") return;
    document.open();
    document.write(e.data.html);
    document.close();
  });
</script>
</body>
</html>
