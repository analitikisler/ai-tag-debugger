<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AITD Recorder</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="top">
  <img class="logo" src="../icons/32.png" alt="" width="20" height="20">
  <div class="site">
    <div id="host" class="host">—</div>
    <div id="status" class="status"><span class="dot"></span><span id="statusText"></span></div>
  </div>
  <button id="record" class="btn primary" type="button"></button>
  <button id="stop" class="btn stop" type="button" hidden></button>
</header>

<div class="planbar">
  <span class="label" data-t="plan"></span>
  <span id="planInfo" class="planinfo"></span>
  <label class="link" for="planFile"><span id="planChoose"></span></label>
  <input id="planFile" type="file" accept=".json,application/json" hidden>
  <button id="planClear" class="link" type="button" hidden data-t="clearPlan"></button>
</div>
<p id="notice" class="notice" hidden></p>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="events"><span data-t="tabs.events"></span><span id="nEvents" class="count"></span></button>
  <button role="tab" data-tab="dataLayer"><span data-t="tabs.dataLayer"></span><span id="nPushes" class="count"></span></button>
  <button role="tab" data-tab="findings"><span data-t="tabs.findings"></span><span id="nFindings" class="count"></span></button>
  <button role="tab" data-tab="history"><span data-t="tabs.history"></span></button>
</nav>

<main>
  <section id="tab-events" class="pane">
    <div class="toolbar">
      <div id="filters" class="chips"></div>
    </div>
    <div id="eventsList" class="steps"></div>
    <p id="eventsEmpty" class="empty"></p>
  </section>

  <section id="tab-dataLayer" class="pane" hidden>
    <div class="toolbar"><label class="check"><input id="hideGtm" type="checkbox" checked><span data-t="hideGtm"></span></label></div>
    <div id="pushList" class="steps"></div>
    <p id="pushEmpty" class="empty" data-t="noPushes"></p>
  </section>

  <section id="tab-findings" class="pane" hidden>
    <div id="verdict" class="verdict" hidden>
      <div id="score" class="score"></div>
      <div>
        <div id="verdictStatus" class="vstatus"></div>
        <div id="verdictHeadline" class="vheadline"></div>
        <div id="sev" class="sev"></div>
      </div>
    </div>
    <ol id="findings" class="findings"></ol>
    <p id="findingsEmpty" class="empty"></p>
    <div id="reportActions" class="actions" hidden>
      <button id="openReport" class="btn primary" type="button" data-t="openReport"></button>
      <button id="exportCapture" class="btn" type="button" data-t="exportCapture"></button>
      <button id="exportHtml" class="btn" type="button" data-t="exportHtml"></button>
      <p class="fine" data-t="exportNote"></p>
    </div>
  </section>

  <section id="tab-history" class="pane" hidden>
    <ol id="recordings" class="recordings"></ol>
    <p id="historyEmpty" class="empty" data-t="noHistory"></p>
  </section>
</main>

<footer class="foot">
  <form id="stepForm" class="stepform" hidden>
    <input id="stepName" type="text" maxlength="120" autocomplete="off">
    <button class="btn" type="submit" data-t="newStep"></button>
  </form>
  <div class="settings">
    <label class="check"><input id="mask" type="checkbox"><span data-t="maskOnScreen"></span></label>
    <select id="lang"></select>
  </div>
</footer>
<script type="module" src="panel.js"></script>
</body>
</html>
