<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai tag debugger</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="chev-d" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></symbol>
  <symbol id="chev-r" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></symbol>
  <symbol id="dots" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".9" fill="currentColor"/><circle cx="8" cy="8" r=".9" fill="currentColor"/><circle cx="12.5" cy="8" r=".9" fill="currentColor"/></symbol>
  <symbol id="search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></symbol>
  <symbol id="check" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></symbol>
  <symbol id="x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="warn" viewBox="0 0 16 16"><path d="M8 2.5l6 11H2z"/><path d="M8 7v3M8 12v.01"/></symbol>
  <symbol id="info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.5v4M8 5v.01"/></symbol>
  <symbol id="shield" viewBox="0 0 16 16"><path d="M8 1.8l5 2v4c0 3.2-2.2 5.4-5 6.4-2.8-1-5-3.2-5-6.4v-4z"/></symbol>
  <symbol id="shield-x" viewBox="0 0 16 16"><path d="M8 1.8l5 2v4c0 3.2-2.2 5.4-5 6.4-2.8-1-5-3.2-5-6.4v-4z"/><path d="M6 6.2l4 4M10 6.2l-4 4"/></symbol>
  <symbol id="shield-c" viewBox="0 0 16 16"><path d="M8 1.8l5 2v4c0 3.2-2.2 5.4-5 6.4-2.8-1-5-3.2-5-6.4v-4z"/><path d="M5.7 8.2l1.7 1.7 3-3.4"/></symbol>
  <symbol id="copy" viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M3 10.5V3.5C3 2.7 3.7 2 4.5 2h6"/></symbol>
  <symbol id="ext" viewBox="0 0 16 16"><path d="M9 2.5h4.5V7M13.5 2.5L7.5 8.5M12 9.5v3.5c0 .6-.4 1-1 1H3.5c-.6 0-1-.4-1-1V5c0-.6.4-1 1-1H7"/></symbol>
  <symbol id="flag" viewBox="0 0 16 16"><path d="M3.5 14V2.5M3.5 3h8l-1.7 3 1.7 3h-8"/></symbol>
  <symbol id="reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 11-1.5-3.6M13 2.5v2.8h-2.8"/></symbol>
  <symbol id="route" viewBox="0 0 16 16"><path d="M2.5 8h9M8.5 4.5L12 8l-3.5 3.5"/></symbol>
  <symbol id="file" viewBox="0 0 16 16"><path d="M9 1.8H4.5c-.6 0-1 .4-1 1v10.4c0 .6.4 1 1 1h7c.6 0 1-.4 1-1V5.3z"/><path d="M9 1.8v3.5h3.5"/></symbol>
  <symbol id="download" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M2.5 13.5h11"/></symbol>
  <symbol id="restart" viewBox="0 0 16 16"><path d="M3 8a5 5 0 105-5H5.5M7.5 1L5.3 3.1 7.5 5.3"/></symbol>
  <symbol id="globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c1.8 1.7 2.6 3.7 2.6 6S9.8 12.3 8 14M8 2C6.2 3.7 5.4 5.7 5.4 8s.8 4.3 2.6 6"/></symbol>
  <symbol id="moon" viewBox="0 0 16 16"><path d="M13.5 9.5A5.5 5.5 0 016.5 2.5a5.5 5.5 0 107 7z"/></symbol>
  <symbol id="eye-off" viewBox="0 0 16 16"><path d="M2 2l12 12M6.6 6.7a2 2 0 002.8 2.8M4.3 4.4C3 5.3 2 6.6 1.5 8c1 2.6 3.6 4.5 6.5 4.5 1.3 0 2.5-.4 3.6-1M7 3.6c.3 0 .7-.1 1-.1 2.9 0 5.5 1.9 6.5 4.5-.3.8-.7 1.5-1.2 2.1"/></symbol>
  <symbol id="help" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M6.3 6.3a1.8 1.8 0 113 1.4c-.7.4-1.3.8-1.3 1.6M8 11.5v.01"/></symbol>
  <symbol id="keyboard" viewBox="0 0 16 16"><rect x="1.5" y="4" width="13" height="8" rx="1.5"/><path d="M4 6.5h.01M6.5 6.5h.01M9 6.5h.01M11.5 6.5h.01M5 9.5h6"/></symbol>
  <symbol id="trash" viewBox="0 0 16 16"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></symbol>
  <symbol id="lock" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></symbol>
  <symbol id="cart" viewBox="0 0 16 16"><path d="M1.5 2.5h2l1.6 7.5h7.4l1.5-5.5H4.3"/><circle cx="6" cy="13" r="1"/><circle cx="11.5" cy="13" r="1"/></symbol>
  <symbol id="plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="filter" viewBox="0 0 16 16"><path d="M2 3h12l-4.5 5.5V13l-3-1.5v-3z"/></symbol>
  <symbol id="list" viewBox="0 0 16 16"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/></symbol>
  <symbol id="sq" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="arrow-d" viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4"/></symbol>
</svg>
<div id="app">
  <header class="hdr" id="hdr" hidden>
    <span id="fav"></span>
    <div class="site">
      <div id="host" class="host">—</div>
      <div id="status" class="status"><span class="dot"></span><span id="statusText" class="txt"></span></div>
    </div>
    <button id="stop" class="btn stop" type="button" hidden><span class="sq"></span><span id="stopLabel"></span></button>
    <button id="startOver" class="btn" type="button" hidden></button>
    <button id="more" class="btn ghost icon" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  </header>
  <div id="banner"></div>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
  <div id="bar"></div>
  <main id="main"></main>
  <footer class="foot" id="foot" hidden>
    <form id="stepForm" autocomplete="off">
      <label class="input"><span id="flagIcon"></span><input id="stepName" type="text" maxlength="120"></label>
      <button class="btn" type="submit" id="markBtn"></button>
    </form>
  </footer>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<script type="module" src="panel.js"></script>
</body>
</html>
