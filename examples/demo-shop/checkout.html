<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Demo Shop</title>
<link rel="stylesheet" href="shop.css">
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('consent', 'default', { ad_storage: 'denied', analytics_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
</script>
<script src="tracker.js"></script>
</head>
<body data-page="checkout">
<header><a href="index.html" class="logo">Demo Shop</a><a href="cart.html" id="cart-link">Cart (<span id="cart-count">0</span>)</a></header>
<main>
<h1>Checkout</h1>
<form id="checkout-form">
<label>Full name <input name="name" required></label>
<label>Email <input name="email" type="email" required></label>
<label>Address <input name="address" required></label>
<label>Payment <select name="payment"><option value="">Choose…</option><option value="test">Test payment (no charge)</option></select></label>
<button type="submit" class="btn">Place order</button>
</form>
</main>
<div id="consent" hidden><p>We use cookies for analytics and advertising.</p><button id="consent-reject">Reject</button><button id="consent-accept">Accept all</button></div>
<script src="app.js"></script>
</body></html>
